openapi: 3.1.0
info:
  title: DnD Chat Agent API
  version: "1.0.0"
  description: Contracts for agent state/version endpoints.
paths:
  /dnd_chat/agent:
    get:
      summary: Get serialized agent state (memories, inventory, versioned)
      responses:
        "200":
          description: Agent state payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentState"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /dnd_chat/agent/version:
    get:
      summary: Get agent state version only
      responses:
        "200":
          description: Agent version payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersion"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /dnd_chat/agent/contract:
    get:
      summary: Get OpenAPI contract for agent endpoints
      responses:
        "200":
          description: OpenAPI document
          content:
            application/yaml:
              schema:
                type: string
            application/json:
              schema:
                type: object
  /dnd_chat/agent/version/contract:
    get:
      summary: Get OpenAPI contract for agent version endpoint
      responses:
        "200":
          description: OpenAPI document
          content:
            application/yaml:
              schema:
                type: string
            application/json:
              schema:
                type: object
components:
  schemas:
    AgentState:
      type: object
      required: [success, version, state]
      properties:
        success:
          type: boolean
          enum: [true]
        version:
          type: integer
        state:
          type: object
          additionalProperties: true
    AgentVersion:
      type: object
      required: [success, version]
      properties:
        success:
          type: boolean
          enum: [true]
        version:
          type: integer
    Error:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string


